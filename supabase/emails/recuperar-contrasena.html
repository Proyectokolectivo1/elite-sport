<!-- Asunto sugerido: Restablece tu contraseña de Elite Sport -->
<!-- Supabase: Authentication > Emails > Reset password -->
<div style="margin:0;padding:32px 16px;background:#0b0b0c;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;margin:0 auto;">
    <tr>
      <td style="padding:0 0 28px 0;font-family:'Arial Narrow',Arial,sans-serif;font-size:26px;font-weight:bold;letter-spacing:1px;color:#f4f2ed;text-transform:uppercase;">
        Elite <span style="color:#a3a29c;">Sport</span> <span style="color:#c8ff2e;">/</span>
      </td>
    </tr>
    <tr>
      <td style="padding:0 0 12px 0;font-family:'Arial Narrow',Arial,sans-serif;font-size:38px;line-height:1;font-weight:bold;color:#f4f2ed;text-transform:uppercase;">

      </td>
    </tr>
    <tr>
      <td style="padding:0 0 28px 0;font-size:16px;line-height:1.5;color:#a3a29c;">

      </td>
    </tr>

      <td style="border-top:1px solid #2a2a2e;padding:20px 0 0 0;font-size:12px;line-height:1.5;color:#a3a29c;">

      </td>
    </tr>
